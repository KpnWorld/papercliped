name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: bridge_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm, cache-dependency-path: "package-lock.json" }
      - run: npm ci
      - run: npm run typecheck
      - name: dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bridge_test
      - name: schema file is up to date
        run: npm run build && npm run schema:sql && git diff --exit-code docs/supabase-schema.sql
      - name: plugin
        run: |
          npm --prefix plugin ci
          npm --prefix plugin run typecheck
          npm --prefix plugin test
          npm --prefix plugin audit --omit=dev --audit-level=high
          npm --prefix plugin run build
