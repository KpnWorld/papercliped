name: Release
# Every push to main checks the version in package.json. If `v<version>` isn't released yet, this tests, publishes both npm
# packages, then tags that exact commit and creates the GitHub release. Bumping the version on main is the whole release:
# nobody pushes tags by hand. npm trusted publishing (OIDC): no npm token is stored anywhere; register this exact filename
# (release.yml) on npmjs.com for both packages. See docs/RELEASING.md.
on:
  push:
    branches: [main]
  workflow_dispatch: # re-run by hand (e.g. after fixing the npm setup); still releases only an unreleased version
permissions:
  contents: write   # tag + GitHub release
  id-token: write   # npm trusted publishing (OIDC)
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }

      - name: Is this version already released?
        id: v
        run: |
          ver="$(node -p "require('./package.json').version")"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$ver" >/dev/null; then
            echo "::warning title=No new version::v$ver is already released, so this push ships nothing. Every push to main should bump the version (node scripts/version.mjs patch|minor|major; see .agents/skills/release/SKILL.md)."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Every package carries the same version
        if: steps.v.outputs.release == 'true'
        run: |
          want="${{ steps.v.outputs.version }}"
          for got in "$(node -p "require('./plugin/package.json').version")" "$(node -p "require('./.claude-plugin/plugin.json').version")"; do
            if [ "$got" != "$want" ]; then echo "::error::version mismatch: $got vs package.json $want"; exit 1; fi
          done
          grep -q "^## v$want\b" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## v$want' section"; exit 1; }

      - uses: actions/setup-node@v6
        if: steps.v.outputs.release == 'true'
        with:
          # No registry-url: it would write an .npmrc with a placeholder NODE_AUTH_TOKEN that npm falls back to (and gets a
          # 404) whenever the trusted-publishing exchange fails. npm's default registry is registry.npmjs.org anyway.
          node-version: "24"   # trusted publishing needs npm >= 11.5.1 and Node >= 22.14
          package-manager-cache: false
      - name: Make sure npm supports trusted publishing
        if: steps.v.outputs.release == 'true'
        run: npm install -g npm@11 && npm --version # trusted publishing needs >= 11.5.1; pinned so a new major can't surprise a release

      - name: Build and test
        if: steps.v.outputs.release == 'true'
        run: |
          npm ci && npm run build && npm test
          npm --prefix plugin ci && npm --prefix plugin run typecheck && npm --prefix plugin test && npm --prefix plugin run build
          node scripts/check-packages.mjs

      # Explains a failed publish: what GitHub's identity token says, and npm's answer to the trusted-publishing exchange for each
      # package (the exchanged token itself is never printed). npm compares the token's repository and workflow file with the
      # trusted publisher configured on npmjs.com.
      - name: Check npm trusted publishing
        if: steps.v.outputs.release == 'true'
        run: |
          oidc="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)"
          echo "GitHub identity: $(cut -d. -f2 <<<"$oidc" | tr '_-' '/+' | base64 -d 2>/dev/null | jq -c '{repository, repository_owner, workflow_ref, ref, environment}' 2>/dev/null)"
          for p in papercliped papercliped-paperclip-plugin; do
            code="$(curl -sS -o "$RUNNER_TEMP/x.json" -w '%{http_code}' -X POST -H "Authorization: Bearer $oidc" "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$p")"
            echo "npm exchange for $p: HTTP $code $(jq -c 'del(.token)' "$RUNNER_TEMP/x.json" 2>/dev/null || head -c 300 "$RUNNER_TEMP/x.json")"
          done

      # Publishing comes before the tag, and each step skips a version that's already on npm, so a failed run can simply be
      # re-run (from the Actions tab) once the cause is fixed.
      - name: Publish papercliped
        if: steps.v.outputs.release == 'true'
        run: |
          ver="${{ steps.v.outputs.version }}"
          if npm view "papercliped@$ver" version >/dev/null 2>&1; then echo "papercliped@$ver is already on npm; skipping."; exit 0; fi
          if [[ "$ver" == *-* ]]; then npm publish --tag beta --loglevel verbose; else npm publish --loglevel verbose; fi
      - name: Publish papercliped-paperclip-plugin
        if: steps.v.outputs.release == 'true'
        working-directory: plugin
        run: |
          ver="${{ steps.v.outputs.version }}"
          if npm view "papercliped-paperclip-plugin@$ver" version >/dev/null 2>&1; then echo "papercliped-paperclip-plugin@$ver is already on npm; skipping."; exit 0; fi
          if [[ "$ver" == *-* ]]; then npm publish --tag beta --loglevel verbose; else npm publish --loglevel verbose; fi

      # The notes are the changelog section for this version, then every commit description pushed since the last release.
      - name: Release notes
        if: steps.v.outputs.release == 'true'
        run: |
          tag="${{ steps.v.outputs.tag }}"
          awk -v tag="$tag" '
            /^## / { if (found) exit; if (index($0, "## " tag) == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          prev="$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)"
          {
            echo; echo "## Commits"; echo
            { git log --no-merges --format='### %s%n%n%b' ${prev:+$prev..}HEAD | grep -v -E '^(Co-Authored-By|Claude-Session|Signed-off-by):' || true; } | head -c 50000
          } >> "$RUNNER_TEMP/notes.md"
      - name: Tag this commit and create the GitHub release
        if: steps.v.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.v.outputs.tag }}"
          flags=(--target "$GITHUB_SHA" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md")
          if [[ "$tag" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$tag" "${flags[@]}"
