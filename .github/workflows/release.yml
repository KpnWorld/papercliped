name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write   # npm provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }
      - run: npm ci
      - run: npm run build && npm test
      - name: Publish to npm (pre-releases go to the `beta` tag)
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then npm publish --tag beta --provenance; else npm publish --provenance; fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
